; Tortuga - prueba aislada de un motor N20 con TB6612FNG
; Target: Seeed Studio XIAO ESP32-C6 (NO un ESP32 generico)
;
; La plataforma oficial "platformio/espressif32" solo trae Arduino core 2.x,
; que no soporta ESP32-C6. pioarduino es el fork mantenido con Arduino core 3.x.

[platformio]
; Windows sin "long paths" habilitado no puede descomprimir el Arduino core 3.x
; (algunas rutas internas superan 260 caracteres). Una carpeta corta lo evita.
; Si habilitas LongPathsEnabled en Windows puedes borrar estas dos lineas.
packages_dir = C:/pio/packages
cache_dir = C:/pio/.cache

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
monitor_filters = default, time
